          bundle = json.loads(lzma.decompress(base64.b64decode(BUNDLE_B64)).decode("utf-8"))

          # Eğer depoda kullanıcı tarafından düzenlenmiş `channels.json` veya `channels.m3u` varsa koru!
          existing_channels_json = None
          if os.path.exists("channels.json") and os.path.getsize("channels.json") > 100:
              try:
                  with open("channels.json", "r", encoding="utf-8") as cf:
                      raw_c = cf.read()
                  json.loads(raw_c)
                  existing_channels_json = raw_c
                  print("Preserving existing repository channels.json customized by user!")
              except Exception as e:
                  print("Existing channels.json invalid, restoring default:", e)

          existing_channels_m3u = None
          if os.path.exists("channels.m3u") and os.path.getsize("channels.m3u") > 50:
              try:
                  with open("channels.m3u", "r", encoding="utf-8") as mf:
                      raw_m = mf.read()
                  if "#EXTINF" in raw_m:
                      existing_channels_m3u = raw_m
                      print("Preserving existing repository channels.m3u customized by user!")
              except Exception as e:
                  print("Existing channels.m3u invalid, restoring default:", e)

          # Eski tek-dosya app/src/main/java dizinini temizle ki 13 modüler dosya tertemiz kurulsun
          if os.path.exists("app/src/main/java"):
              shutil.rmtree("app/src/main/java")

          for rel_path, content in bundle.items():
              if rel_path in ("channels.json", "app/src/main/assets/channels.json") and existing_channels_json is not None:
                  content = existing_channels_json
              if rel_path == "channels.m3u" and existing_channels_m3u is not None:
                  content = existing_channels_m3u
              parent = os.path.dirname(rel_path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as f:
                  f.write(content)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          if sdk_root:
              lic_dir = os.path.join(sdk_root, "licenses")
              os.makedirs(lic_dir, exist_ok=True)
              with open(os.path.join(lic_dir, "android-sdk-license"), "w") as lf:
                  lf.write("\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n")
              with open(os.path.join(lic_dir, "android-sdk-preview-license"), "w") as lf:
                  lf.write("\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n")

          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", "app/redox-release-key.jks",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "redoxtv",
              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
              "-dname", "CN=RedoX TV, OU=TV, O=RedoX, L=Manisa, S=TR, C=TR"
          ], check=True)
          print("Modular RedoX TV v1.5.3 project, channels.json & channels.m3u generated successfully!")
          EOF

      - name: Commit Modular Files, channels.json & channels.m3u to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md channels.json channels.m3u build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/
          if ! git diff --cached --quiet; then
            git commit -m "refactor: modular Kotlin architecture + dynamic channels.json and channels.m3u [skip ci]"
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong" -A 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.5.3-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.5.3-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-v1.5.3-Official-Release-APK
          path: RedoX-TV-v1.5.3-Release.apk

      - name: Publish Official GitHub Release (v1.5.3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.5.3 — Modüler Mimari & Dinamik GitHub `channels.json` / `channels.m3u` Sürümü

          ### ⚡ Mimari ve Altyapı Yenilikleri
          - **13 Dosyalı Katmanlı Modüler Kotlin Mimarisi:** `model/`, `theme/`, `player/`, `data/`, `network/`, `viewmodel/`, `ui/components/`, `ui/screens/` ve `ui/player/` paketlerine ayrılmış temiz açık kaynak mimarisi (`LocalTransferWebServer.kt` ve `TvCommonComponents.kt` yorum bloğu sınırı düzeltildi).
          - **GitHub Üzerinden Dinamik Güncellenen `channels.json` ve `channels.m3u`:** Deponun ana dizinindeki `channels.json` veya `channels.m3u` dosyasını düzenlediğinizde APK güncellemeye gerek kalmadan uygulama açılışta otomatik güncellenir.
          NOTES_EOF
          if gh release view v1.5.3 >/dev/null 2>&1; then
            gh release upload v1.5.3 RedoX-TV-v1.5.3-Release.apk --clobber
            gh release edit v1.5.3 --title "RedoX TV v1.5.3 (Modular & Dynamic JSON/M3U Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.5.3 RedoX-TV-v1.5.3-Release.apk --title "RedoX TV v1.5.3 (Modular & Dynamic JSON/M3U Release)" --notes-file RELEASE_NOTES.md
          fi
