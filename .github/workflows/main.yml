      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong|Exception" -A 4 build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.5.0-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.5.0-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-v1.5.0-Official-Release-APK
          path: RedoX-TV-v1.5.0-Release.apk

      - name: Publish Official GitHub Release (v1.5.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.5.0 — Chromecast 4K & Android TV Resmi Sürüm (Multi-Source Edition)

          ### ⚡ v1.5.0 Güncellemeleri
          - **`TR-KANALLAR.m3u` Kanalları ve 900+ Alternatif Yayın Kaynağı Eklendi:** Paylaştığınız `TR-KANALLAR.m3u` içindeki tüm kanallar (*CNN Türk, Flash Haber HD, Ekol Spor HD, NR1 Türk TV, NR1 Dance, NR1 Rap, Damar Türk TV, Ritim TV, Şaban TV, VRT TV, TV B, Slow Karadeniz FM, Çay FM* vb.) ve yüksek hızlı 1080p/Chunks yayınları ana listeye eklendi (Toplam **297 Yerleşik Kanal** ve **900+ Alternatif Yayın Akışı**).
          - **Hızlı Otomatik Alternatif Geçişi (3.2 Sn) ve Çalışan Kaynağı Hafızaya Alma:** Bir kanalın ilk kaynağı yanıt vermezse veya 3.2 saniye içinde açılmazsa otomatik olarak sıradaki alternatif kaynağa (`Akış 2`, `Akış 3`, `Akış 4`...) geçer ve açılan çalışan kaynağı hafızaya kaydederek bir sonraki açılışta doğrudan o kaynaktan başlatır.
          NOTES_EOF
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 RedoX-TV-v1.5.0-Release.apk --clobber
            gh release edit v1.5.0 --title "RedoX TV v1.5.0 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.5.0 RedoX-TV-v1.5.0-Release.apk --title "RedoX TV v1.5.0 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          fi
