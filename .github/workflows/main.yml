          +BEDQ//LPY3oEAAA4dSasElT7HUAAbfhBKWDMquLhlmxxGf7AgAAAAAEWVo=
          """
          bundle = json.loads(lzma.decompress(base64.b64decode(BUNDLE_B64)).decode("utf-8"))

          def encrypt_redox(plain_text: str) -> str:
              key_hex = hashlib.sha256(b"RedoX_TV_2026_Secret_Key_4K").hexdigest()
              iv_bytes = os.urandom(16)
              p = subprocess.run(
                  ["openssl", "enc", "-aes-256-cbc", "-K", key_hex, "-iv", iv_bytes.hex(), "-nosalt"],
                  input=plain_text.encode("utf-8"),
                  capture_output=True,
                  check=True
              )
              return "REDOX_ENC_V1:" + base64.b64encode(iv_bytes + p.stdout).decode("ascii")

          # 1) Eğer kullanıcı depoya yeni bir `channel/channels.enc` yüklediyse onu koru!
          # 2) Eğer kullanıcı depoya açık `channel/channels.m3u` veya `channel/channels.json` yüklediyse,
          #    onu otomatik olarak AES-256 ile `channel/channels.enc` içine şifrele ve açık dosyaları sil!
          custom_enc = None
          for plain_candidate in ["channel/channels.m3u", "channel/channels.json", "channels.m3u", "channels.json"]:
              if os.path.exists(plain_candidate) and os.path.getsize(plain_candidate) > 50:
                  with open(plain_candidate, "r", encoding="utf-8", errors="ignore") as pf:
                      raw_plain = pf.read().strip()
                  if "#EXTINF" in raw_plain or raw_plain.startswith("{") or raw_plain.startswith("["):
                      custom_enc = encrypt_redox(raw_plain)
                      print(f"Auto-encrypted {plain_candidate} into channel/channels.enc!")
                      break

          if custom_enc is None and os.path.exists("channel/channels.enc") and os.path.getsize("channel/channels.enc") > 50:
              with open("channel/channels.enc", "r", encoding="utf-8", errors="ignore") as ef:
                  raw_e = ef.read().strip()
              if raw_e.startswith("REDOX_ENC_V1:"):
                  custom_enc = raw_e
                  print("Preserving existing encrypted channel/channels.enc from repository!")

          # Açık m3u ve json dosyalarını temizle ki GitHub'da yalnızca şifreli `channel/channels.enc` kalsın!
          for old_f in ["channels.json", "channels.m3u", "channel/channels.json", "channel/channels.m3u", "app/src/main/assets/channels.json"]:
              if os.path.exists(old_f):
                  os.remove(old_f)

          seed_plain = bundle.pop("__SEED_CHANNELS__", "")
          final_enc = custom_enc if custom_enc is not None else encrypt_redox(seed_plain)
          bundle["channel/channels.enc"] = final_enc
          bundle["app/src/main/assets/channels.enc"] = final_enc

          if os.path.exists("app/src/main/java"):
              shutil.rmtree("app/src/main/java")

          for rel_path, content in bundle.items():
              parent = os.path.dirname(rel_path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as f:
                  f.write(content)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          if sdk_root:
              lic_dir = os.path.join(sdk_root, "licenses")
              os.makedirs(lic_dir, exist_ok=True)
              with open(os.path.join(lic_dir, "android-sdk-license"), "w") as lf:
                  lf.write("\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n")
              with open(os.path.join(lic_dir, "android-sdk-preview-license"), "w") as lf:
                  lf.write("\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n")

          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", "app/redox-release-key.jks",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "redoxtv",
              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
              "-dname", "CN=RedoX TV, OU=TV, O=RedoX, L=Manisa, S=TR, C=TR"
          ], check=True)
          print("Modular RedoX TV v1.7.0 project & encrypted channels.enc generated successfully!")
          EOF

      - name: Commit Encrypted channel/channels.enc & Remove Plaintext Channel Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch channels.json channels.m3u channel/channels.json channel/channels.m3u app/src/main/assets/channels.json || true
          git add README.md channel/channels.enc build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/
          if ! git diff --cached --quiet; then
            git commit -m "feat: RedoX TV v1.7.0 AES-256 encrypted channels.enc, animations & Chromecast 4K D-Pad [skip ci]"
            git push || true
          fi

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong" -A 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.7.0-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.7.0-Debug.apk
          echo "### ✅ RedoX TV v1.7.0 APK Başarıyla Derlendi!" >> $GITHUB_STEP_SUMMARY
          echo "- **İmzalı Release APK:** \`RedoX-TV-v1.7.0-Release.apk\` (GitHub Releases sayfasına yüklendi)" >> $GITHUB_STEP_SUMMARY

      - name: Publish Official GitHub Release (v1.7.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.7.0 — AES-256 Şifreli Kanal Listesi, Hafif Animasyonlar & Chromecast 4K Kumanda Sürümü

          ### ⚡ v1.7.0 Yenilikleri
          1. **AES-256 Şifreli GitHub Kanal Listesi (`channel/channels.enc`):** GitHub deposundaki açık `.m3u` ve `.json` dosyaları kaldırılarak tamamı `AES-256-CBC` ile şifrelenmiş `channel/channels.enc` yapısına geçirildi.
          2. **308. Kanalda Takılan Sağlık Taraması ("Tümünü Test Et") Düzeltildi:** Radyo/Icecast akışları ve yanıt vermeyen DNS/SSL sunucuları için 1.4 sn kesin zaman aşımı (`CompletableDeferred` + daemon thread) eklendi; tarama %100 tamamlanır.
          3. **Hafif Donanım Hızlandırmalı Animasyonlar:** Kartlarda, çiplerde ve menülerde GPU hızlandırmalı 135ms `graphicsLayer` ölçekleme ve yumuşak geçiş animasyonları aktif edildi.
          4. **Chromecast 4K Kumanda (D-Pad) Optimizasyonu:** Rakam ve `CH+/CH-` tuşu olmayan kumandalar için oynatıcı içine **Ekran Üstü Sanal Numaratör (`🔢 Kanal No 0-9`)**, 4'lü Çoklu Ekran (2x2) hücrelerine ise **OK Tuşuyla Açılan Hücre İçi Kanal/Tam Ekran Kontrol Çubuğu** eklendi.
          NOTES_EOF
          if gh release view v1.7.0 >/dev/null 2>&1; then
            gh release upload v1.7.0 RedoX-TV-v1.7.0-Release.apk --clobber
            gh release edit v1.7.0 --title "RedoX TV v1.7.0 (Encrypted Channels & Chromecast 4K Edition)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.7.0 RedoX-TV-v1.7.0-Release.apk --title "RedoX TV v1.7.0 (Encrypted Channels & Chromecast 4K Edition)" --notes-file RELEASE_NOTES.md
          fi
