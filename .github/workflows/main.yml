      - name: Commit Modular Files & channels.json to Repository (If Needed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md channels.json build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/
          if ! git diff --cached --quiet; then
            git commit -m "refactor: split into modular Kotlin files and dynamic channels.json [skip ci]"
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong" -A 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.5.2-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.5.2-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-v1.5.2-Official-Release-APK
          path: RedoX-TV-v1.5.2-Release.apk

      - name: Publish Official GitHub Release (v1.5.2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.5.2 — Modüler Mimari & Dinamik GitHub `channels.json` Sürümü

          ### ⚡ Mimari ve Altyapı Yenilikleri
          - **13 Dosyalı Katmanlı Modüler Kotlin Mimarisi:** Tek dosyalık 8.300 satırlık yapı yerine `model/`, `theme/`, `player/`, `data/`, `network/`, `viewmodel/`, `ui/components/`, `ui/screens/` ve `ui/player/` paketlerine ayrılmış temiz açık kaynak mimarisi.
          - **GitHub Üzerinden Dinamik Güncellenen `channels.json`:** Tüm 299 yerleşik kanal ve 1.184 yayın akışı artık deponun ana dizinindeki `channels.json` dosyasından dinamik olarak çekilir. Çalışmayan bir kanalı sildiğinizde veya `.m3u8` linkini GitHub üzerinden değiştirdiğinizde APK güncellemeye gerek kalmadan uygulama açılışta otomatik güncellenir.
          - **Çevrimdışı Yedek (`assets/channels.json`) + Otomatik Alternatif Kaynak Geçişi (3.2 Sn)** aktif.
          NOTES_EOF
          if gh release view v1.5.2 >/dev/null 2>&1; then
            gh release upload v1.5.2 RedoX-TV-v1.5.2-Release.apk --clobber
            gh release edit v1.5.2 --title "RedoX TV v1.5.2 (Modular & Dynamic JSON Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.5.2 RedoX-TV-v1.5.2-Release.apk --title "RedoX TV v1.5.2 (Modular & Dynamic JSON Release)" --notes-file RELEASE_NOTES.md
          fi
