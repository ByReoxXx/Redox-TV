          bundle = json.loads(lzma.decompress(base64.b64decode(BUNDLE_B64)).decode("utf-8"))

          # Eğer depoda kullanıcı tarafından düzenlenmiş bir `channels.json` varsa onu koru!
          existing_channels_json = None
          if os.path.exists("channels.json") and os.path.getsize("channels.json") > 100:
              try:
                  with open("channels.json", "r", encoding="utf-8") as cf:
                      raw_c = cf.read()
                  json.loads(raw_c)
                  existing_channels_json = raw_c
                  print("Preserving existing repository channels.json customized by user!")
              except Exception as e:
                  print("Existing channels.json invalid, restoring default:", e)

          # Eski tek-dosya app/src/main/java dizinini temizle ki modüler yapı tertemiz kurulsun
          if os.path.exists("app/src/main/java"):
              shutil.rmtree("app/src/main/java")

          for rel_path, content in bundle.items():
              if rel_path in ("channels.json", "app/src/main/assets/channels.json") and existing_channels_json is not None:
                  content = existing_channels_json
              parent = os.path.dirname(rel_path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as f:
                  f.write(content)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          if sdk_root:
              lic_dir = os.path.join(sdk_root, "licenses")
              os.makedirs(lic_dir, exist_ok=True)
              with open(os.path.join(lic_dir, "android-sdk-license"), "w") as lf:
                  lf.write("\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n")
              with open(os.path.join(lic_dir, "android-sdk-preview-license"), "w") as lf:
                  lf.write("\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n")

          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", "app/redox-release-key.jks",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "redoxtv",
              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
