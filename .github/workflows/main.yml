name: Release RedoX TV v1.7.0 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Configure JDK 17 & Gradle 8.9
        run: |
          JDK17_DIR="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          if [ ! -d "$JDK17_DIR" ]; then
            JDK17_DIR=$(ls -d /usr/lib/jvm/*17* 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$JDK17_DIR" ] && [ -d "$JDK17_DIR" ]; then
            echo "JAVA_HOME=$JDK17_DIR" >> "$GITHUB_ENV"
            echo "$JDK17_DIR/bin" >> "$GITHUB_PATH"
          fi
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9.zip
          unzip -q -o /tmp/gradle-8.9.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

