          bundle = json.loads(lzma.decompress(base64.b64decode(BUNDLE_B64)).decode("utf-8"))

          # Eğer depoda kullanıcı tarafından düzenlenmiş `channel/channels.json` veya `channel/channels.m3u` varsa koru!
          existing_channels_json = None
          for cand_json in ["channel/channels.json", "channels.json"]:
              if os.path.exists(cand_json) and os.path.getsize(cand_json) > 100:
                  try:
                      with open(cand_json, "r", encoding="utf-8") as cf:
                          raw_c = cf.read()
                      json.loads(raw_c)
                      existing_channels_json = raw_c
                      print(f"Preserving existing repository {cand_json} customized by user!")
                      break
                  except Exception as e:
                      print(f"Existing {cand_json} invalid, restoring default:", e)

          existing_channels_m3u = None
          for cand_m3u in ["channel/channels.m3u", "channels.m3u"]:
              if os.path.exists(cand_m3u) and os.path.getsize(cand_m3u) > 50:
                  try:
                      with open(cand_m3u, "r", encoding="utf-8") as mf:
                          raw_m = mf.read()
                      if "#EXTINF" in raw_m:
                          existing_channels_m3u = raw_m
                          print(f"Preserving existing repository {cand_m3u} customized by user!")
                          break
                  except Exception as e:
                      print(f"Existing {cand_m3u} invalid, restoring default:", e)

          # Eski ana dizindeki channels.json ve channels.m3u dosyalarını temizle (artık channel/ klasöründe)
          for old_root_f in ["channels.json", "channels.m3u"]:
              if os.path.exists(old_root_f):
                  os.remove(old_root_f)

          if os.path.exists("app/src/main/java"):
              shutil.rmtree("app/src/main/java")

          for rel_path, content in bundle.items():
              if rel_path in ("channel/channels.json", "app/src/main/assets/channels.json") and existing_channels_json is not None:
                  content = existing_channels_json
              if rel_path == "channel/channels.m3u" and existing_channels_m3u is not None:
                  content = existing_channels_m3u
              parent = os.path.dirname(rel_path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as f:
                  f.write(content)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          if sdk_root:
              lic_dir = os.path.join(sdk_root, "licenses")
              os.makedirs(lic_dir, exist_ok=True)
              with open(os.path.join(lic_dir, "android-sdk-license"), "w") as lf:
                  lf.write("\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n")
              with open(os.path.join(lic_dir, "android-sdk-preview-license"), "w") as lf:
                  lf.write("\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n")

          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", "app/redox-release-key.jks",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "redoxtv",
              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
              "-dname", "CN=RedoX TV, OU=TV, O=RedoX, L=Manisa, S=TR, C=TR"
          ], check=True)
          print("Modular RedoX TV v1.5.6 project, built-in M3U explorer & channels.json generated successfully!")
          EOF

      - name: Commit Modular Files, channels.json & channels.m3u to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch channels.json channels.m3u || true
          git add README.md channel/ build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/
          if ! git diff --cached --quiet; then
            git commit -m "feat: move channels.json and channels.m3u into channel/ folder v1.5.6 [skip ci]"
            git push || true
          fi

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong" -A 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.5.6-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.5.6-Debug.apk
          echo "### ✅ RedoX TV v1.5.6 APK Başarıyla Derlendi!" >> $GITHUB_STEP_SUMMARY
          echo "- **İmzalı Release APK:** \`RedoX-TV-v1.5.6-Release.apk\` (GitHub Releases sayfasına yüklendi)" >> $GITHUB_STEP_SUMMARY

      - name: Publish Official GitHub Release (v1.5.6)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.5.6 — Dahili TV M3U Dosya Seçici & Modüler Mimari Sürümü

          ### ⚡ v1.5.6 Yenilikleri
          - **Dahili Kumanda Destekli M3U Dosya Gezgini (`TvBuiltInM3uFilePickerDialog`):** Android TV / Chromecast 4K cihazlarında sistem dosya seçicisi bulunmadığı için çıkan *"Bunu yapabilecek uygulamanız yok"* uyarısı tamamen giderildi. Artık **"Dosyadan M3U Seç"** butonuna bastığınızda doğrudan uygulama içinde kumanda ile çalışan **Dahili M3U Dosya Seçici ve Klasör Gezgini** açılır (`Download`, `Ana Dizin /sdcard`, `USB Bellek` ve otomatik `.m3u/.m3u8` tarayıcı).
          - **Tek Tuşla Android TV Depolama İzni (`MANAGE_EXTERNAL_STORAGE`):** `Download` klasöründeki `.m3u` dosyalarını okuyabilmek için dosya seçici içinden tek tuşla izin verme desteği eklendi.
          - **13 Dosyalı Modüler Mimari + GitHub Üzerinden Dinamik `channels.json` ve `channels.m3u`** aktif.
          NOTES_EOF
          if gh release view v1.5.6 >/dev/null 2>&1; then
            gh release upload v1.5.6 RedoX-TV-v1.5.6-Release.apk --clobber
