      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong" -A 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.5.1-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.5.1-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-v1.5.1-Official-Release-APK
          path: RedoX-TV-v1.5.1-Release.apk

      - name: Publish Official GitHub Release (v1.5.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.5.1 — Chromecast 4K & Android TV Resmi Sürüm (Multi-Source Edition)

          ### ⚡ v1.5.1 Güncellemeleri
          - **Kotlin Derleme Hatası Giderildi (`savedSourceIndex` & `itemsIndexed`):** Oynatıcı kaynak hafızası kontrolü `preferredSources[playingChannel.id]` olarak düzeltildi ve 299 kanal 8 dengeli parçaya bölündü.
          - **299 Yerleşik Kanal ve 1.184 Alternatif Yayın Kaynağı:** `TR-KANALLAR.m3u`, `ACIPTV` Türk kanalları, **Sözcü TV (`CH 65`)** ve **KOZA TV (`CH 190`)** dahil tüm kanallarda kanal başına 3 ila 6 alternatif akış aktif.
          - **Hızlı Otomatik Alternatif Geçişi (3.2 Sn) ve Çalışan Kaynağı Hafızaya Alma** aktif.
          NOTES_EOF
          if gh release view v1.5.1 >/dev/null 2>&1; then
            gh release upload v1.5.1 RedoX-TV-v1.5.1-Release.apk --clobber
            gh release edit v1.5.1 --title "RedoX TV v1.5.1 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.5.1 RedoX-TV-v1.5.1-Release.apk --title "RedoX TV v1.5.1 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          fi
