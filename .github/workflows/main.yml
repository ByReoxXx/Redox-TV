          python3 - << 'EOF'
          import os, base64, lzma, shutil, subprocess
          for p in ["app", "build.gradle.kts", "settings.gradle.kts", "gradle.properties"]:
              if os.path.exists(p):
                  if os.path.isdir(p): shutil.rmtree(p)
                  else: os.remove(p)
          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          if sdk_root:
              lic_dir = os.path.join(sdk_root, "licenses")
              os.makedirs(lic_dir, exist_ok=True)
