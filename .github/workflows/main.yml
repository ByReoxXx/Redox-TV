              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
              "-dname", "CN=RedoX TV, OU=TV, O=RedoX, L=Manisa, S=TR, C=TR"
          ], check=True)
          print("RedoX TV v1.1.0 Official Release project & signing keystore generated successfully!")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong|Exception" -A 4 build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.1.0-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.1.0-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-v1.1.0-Official-Release-APK
          path: RedoX-TV-v1.1.0-Release.apk

      - name: Publish Official GitHub Release (v1.1.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.1.0 — Chromecast 4K & Android TV Resmi Sürüm (Signed Release APK)

          ### 🛠️ v1.1.0 Güncellemeleri
          - **Favorilerden Kanal Çıkarma Düzeltmesi:** Favorilerden kanal çıkarıldığında odağın sol üst logoya kayıp Landing Page'i açması sorunu tamamen giderildi; odak artık bir sonraki favori kanalda sabit kalır.
          - **Tüm Kanalları Kapsayan Paralel Sağlık Taraması:** `🩺 Tümünü Test Et` özelliği artık 36 kanal yerine yerleşik 222 kanalın tamamını ve eklenen tüm Özel M3U kanallarını 16'lı paralel akışlarla baştan sona tarar ve canlı ilerleme (`64/222` vb.) gösterir.
          - **Yeni "📌 Tut & Taşı" (Grab & Move) Favori Sıralama Sistemi:** Favorilerim listesinde kanal üzerinde **► (Sağ)** tuşuna basarak kanalı tutup **▲ / ▼** yön tuşlarıyla odak kaybolmadan kaydırma, **►** ile 5'er sıra hızlı zıplatma ve üst bardan tek tıkla **🔤 A-Z / 🔢 Kanal No / 📂 Kategori** sıralama eklendi.
          NOTES_EOF
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 RedoX-TV-v1.1.0-Release.apk --clobber
            gh release edit v1.1.0 --title "RedoX TV v1.1.0 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.1.0 RedoX-TV-v1.1.0-Release.apk --title "RedoX TV v1.1.0 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          fi
