          E517jxc5n5RkZ5nn2KUlZzinxa4DrNMEhOzKYYQ/9lATAy5UOLTPpsV7hoPG+PpZQABaNnrRb/DGMgABvJYFvOhRozpKgbHEZ/sC
          AAAAAARZWg==
          """
          bundle = json.loads(lzma.decompress(base64.b64decode(BUNDLE_B64)).decode("utf-8"))

          for old_root_f in ["channels.json", "channels.m3u"]:
              if os.path.exists(old_root_f):
                  os.remove(old_root_f)

          if os.path.exists("app/src/main/java"):
              shutil.rmtree("app/src/main/java")

          for rel_path, content in bundle.items():
              parent = os.path.dirname(rel_path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as f:
                  f.write(content)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          if sdk_root:
              lic_dir = os.path.join(sdk_root, "licenses")
              os.makedirs(lic_dir, exist_ok=True)
              with open(os.path.join(lic_dir, "android-sdk-license"), "w") as lf:
                  lf.write("\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n")
              with open(os.path.join(lic_dir, "android-sdk-preview-license"), "w") as lf:
                  lf.write("\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n")

          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", "app/redox-release-key.jks",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "redoxtv",
              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
              "-dname", "CN=RedoX TV, OU=TV, O=RedoX, L=Manisa, S=TR, C=TR"
          ], check=True)
          print("Modular RedoX TV v1.6.1 project generated successfully!")
          EOF

      - name: Commit Modular Files & channel/ Folder to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch channels.json channels.m3u || true
          git add README.md channel/ build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/
          if ! git diff --cached --quiet; then
            git commit -m "feat: RedoX TV v1.6.1 universal touch + D-Pad, 2x2 Multi-View & stream optimization [skip ci]"
            git push || true
          fi

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong" -A 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.6.1-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.6.1-Debug.apk
          echo "### ✅ RedoX TV v1.6.1 APK Başarıyla Derlendi!" >> $GITHUB_STEP_SUMMARY
          echo "- **İmzalı Release APK:** \`RedoX-TV-v1.6.1-Release.apk\` (GitHub Releases sayfasına yüklendi)" >> $GITHUB_STEP_SUMMARY

      - name: Publish Official GitHub Release (v1.6.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.6.1 — Android TV, Chromecast 4K, Tablet & Telefon Evrensel Sürüm

          ### ⚡ v1.6.1 Yenilikleri ve Çözülen Sorunlar
          1. **Dosyadan M3U Seçici Child Pencere (Dialog) D-Pad Kilidi:** M3U dosya seçici ve PIN ekranı gerçek Android `Dialog` alt penceresine alındı; kumanda odağı asla arka plana kaçmaz, her dosya/klasör satırı doğrudan tek tuşla seçilir.
          2. **Özel M3U Klasörü Çökme Sorunu Giderildi:** Aynı `tvg-id` veya mükerrer kanal adına sahip M3U dosyalarında oluşan çökme giderildi; aynı isimli kanallar otomatik olarak yedek akış (`Akış 1, 2, 3`) şeklinde birleştirilir.
          3. **Kanaldan Çıkınca İzlenen Kanala Odaklanma & D-Pad Optimizasyonu:** Kanaldan Geri tuşuyla çıkıldığında odak artık sol menüye kaçmaz, doğrudan izlediğiniz kanalın kartına döner. Tüm butonlardaki çift odak (`focusable + clickable`) çakışmaları kaldırıldı.
          4. **4'lü Çoklu Ekran (2x2 Multi-View) Alt Ekranlara Geçiş ve Siyah Ekran Çözümü:** Üstteki 2 ekrandan alttaki 2 ekrana D-Pad geçişi açıldı; `TextureView` + `setEnableDecoderFallback(true)` ile Android TV Box'larda alttaki ekranların siyah kalması engellendi.
          5. **Android Tablet ve Telefon Dokunmatik Desteği:** Tüm kartlar (`combinedClickable`), menüler ve oynatıcı ekranı dokunmatik ekranlarda tek dokunuşla çalışacak şekilde güncellendi.
          6. **KOZA TV Haber Kategorisine Taşındı & Yayın Kaynakları Optimize Edildi:** Tüm ulusal ve haber kanallarında adaptif ana yayınlar 1. sıraya alındı ve SSL/CDN başlık uyumluluğu artırıldı.
          NOTES_EOF
          if gh release view v1.6.1 >/dev/null 2>&1; then
            gh release upload v1.6.1 RedoX-TV-v1.6.1-Release.apk --clobber
            gh release edit v1.6.1 --title "RedoX TV v1.6.1 (TV, Tablet & Phone Universal Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.6.1 RedoX-TV-v1.6.1-Release.apk --title "RedoX TV v1.6.1 (TV, Tablet & Phone Universal Release)" --notes-file RELEASE_NOTES.md
          fi
