              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "redoxtv",
              "-storepass", "redoxtv2026", "-keypass", "redoxtv2026",
              "-dname", "CN=RedoX TV, OU=TV, O=RedoX, L=Manisa, S=TR, C=TR"
          ], check=True)
          print("Modular RedoX TV v1.6.0 project generated successfully!")
