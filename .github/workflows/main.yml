      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Production Release APK & Debug APK
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong|Exception" -A 4 build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk RedoX-TV-v1.3.0-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RedoX-TV-v1.3.0-Debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-v1.3.0-Official-Release-APK
          path: RedoX-TV-v1.3.0-Release.apk

      - name: Publish Official GitHub Release (v1.3.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'NOTES_EOF' > RELEASE_NOTES.md
          ## 🐂 RedoX TV v1.3.0 — Chromecast 4K & Android TV Resmi Sürüm (Signed Release APK)

          ### 📺 v1.3.0 Güncellemeleri
          - **Sözcü TV (`CH 65` - Haber)** ve **KOZA TV (`CH 190` - Yerel)** ana yerleşik kanal listesine eklendi (Toplam **224 Yerleşik Canlı Kanal**).
          - **Gerçek ISO/IEC 18004 (25x25) QR Kod ve Kesintisiz D-Pad M3U Input Sistemi** dahil tüm özellikler aktif.
          NOTES_EOF
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 RedoX-TV-v1.3.0-Release.apk --clobber
            gh release edit v1.3.0 --title "RedoX TV v1.3.0 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.3.0 RedoX-TV-v1.3.0-Release.apk --title "RedoX TV v1.3.0 (Official Signed Release)" --notes-file RELEASE_NOTES.md
          fi
